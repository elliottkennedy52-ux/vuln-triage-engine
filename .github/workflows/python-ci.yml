name: Python CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  lint-test-and-smoke:
    name: Ruff Lint, Pytest & CLI Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff pytest
      - run: ruff check --ignore E501 .
      - run: PYTHONPATH=. pytest -v
      - run: python3 triage_engine.py --help
